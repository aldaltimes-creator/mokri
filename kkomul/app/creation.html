<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>우리 아이 이야기 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-top">
    <div class="wrap app-top__inner">
      <a class="logo" href="index.html" aria-label="꼬물상자 앨범">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <nav class="app-top__nav" aria-label="앱 메뉴">
        <a href="index.html">앨범</a>
        <a href="plans.html">이용권</a>
        <a href="account.html">계정</a>
      </nav>
    </div>
  </header>

  <main class="app-main wrap" id="main">
    <article class="creation" id="creation" aria-live="polite">
      <p class="muted">불러오는 중…</p>
    </article>
  </main>

  <!-- 하드북 주문 -->
  <dialog class="sheet" id="order-dialog" aria-labelledby="order-dialog-title">
    <form method="dialog" id="order-form">
      <div class="sheet__head">
        <h2 id="order-dialog-title">동화 하드북 주문</h2>
        <button class="sheet__close" value="cancel" formnovalidate aria-label="닫기">×</button>
      </div>
      <div class="sheet__body">
        <p class="notice">하드커버 그림책으로 만들어 집으로 보내 드려요. <b>1권 35,000원</b></p>
        <label class="field"><span>표지에 넣을 이름</span><input class="input" name="cover_name" required maxlength="20"></label>
        <div class="row">
          <label class="field"><span>받는 분</span><input class="input" name="recipient" required maxlength="30" autocomplete="name"></label>
          <label class="field"><span>연락처</span><input class="input" name="phone" required inputmode="tel" pattern="[0-9\-]{9,14}" placeholder="010-1234-5678" autocomplete="tel"></label>
        </div>
        <label class="field"><span>주소</span><textarea class="textarea" name="address" required minlength="5" maxlength="200" autocomplete="street-address" style="min-height:80px"></textarea></label>
        <p class="muted">결제는 아직 연결되지 않았어요. 주문은 ‘접수’ 상태로 저장되고, 결제 연동 뒤 안내해 드려요.</p>
      </div>
      <div class="sheet__foot">
        <button class="btn btn--ghost btn--sm" value="cancel" formnovalidate>취소</button>
        <button class="btn btn--primary btn--sm" value="save">주문 접수</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="creation.js"></script>
</body>
</html>
