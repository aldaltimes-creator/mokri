<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>로그인 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="auth">
    <div class="card auth__card">
      <a class="auth__logo logo" href="../index.html" aria-label="꼬물상자 소개로 돌아가기">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <p class="muted" style="text-align:center">우리 아이 기록으로 동화와 노래를 만들어요</p>

      <div class="auth__tabs" role="tablist" aria-label="로그인 또는 가입">
        <button type="button" role="tab" id="tab-in" aria-selected="true" aria-controls="auth-form">로그인</button>
        <button type="button" role="tab" id="tab-up" aria-selected="false" aria-controls="auth-form" tabindex="-1">처음이에요</button>
      </div>

      <form id="auth-form" class="stack" role="tabpanel" aria-labelledby="tab-in" novalidate>
        <label class="field">
          <span>이메일</span>
          <input class="input" id="email" type="email" autocomplete="email" required placeholder="parent@example.com">
        </label>
        <label class="field">
          <span>비밀번호 <small>8자 이상</small></span>
          <input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <button class="btn btn--primary btn--block" id="submit" type="submit">로그인</button>
        <button class="btn--text" id="forgot" type="button">비밀번호를 잊었어요</button>
        <p class="auth__msg" id="msg" role="status" aria-live="polite"></p>
      </form>

      <a class="auth__back" href="../index.html">← 꼬물상자 소개 보기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
