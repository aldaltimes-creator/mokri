<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>계정 — 꼬물상자</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-top">
    <div class="wrap app-top__inner">
      <a class="logo" href="index.html" aria-label="꼬물상자 앨범">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="logo__box" x="5" y="12" width="22" height="16" rx="4"/><rect class="logo__lid" x="3" y="8" width="26" height="6" rx="3"/><path class="logo__star" d="m16 1 1.6 3.3 3.6.5-2.6 2.5.6 3.6L16 9.2l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg>
        꼬물상자
      </a>
      <nav class="app-top__nav" aria-label="앱 메뉴">
        <a href="index.html">앨범</a>
        <a href="plans.html">이용권</a>
        <a href="account.html" aria-current="page">계정</a>
      </nav>
    </div>
  </header>

  <main class="app-main wrap wrap--narrow" id="main">
    <h1 class="page-title">계정</h1>
    <p class="muted" id="email" style="margin-top:4px"></p>

    <section class="card" style="padding:24px;margin-top:22px" aria-labelledby="child-title">
      <h2 id="child-title" style="font-family:var(--serif);font-size:19px;margin-bottom:14px">아이 정보</h2>
      <form id="child-form" class="stack">
        <div class="row">
          <label class="field"><span>이름</span><input class="input" name="name" required maxlength="20"></label>
          <label class="field"><span>생일</span><input class="input" name="birth_date" type="date"></label>
        </div>
        <label class="field"><span>좋아하는 것 <small>쉼표로 나눠 적어요</small></span><input class="input" name="likes"></label>
        <label class="field"><span>가족 호칭</span><input class="input" name="family_call" maxlength="60"></label>
        <button class="btn btn--primary btn--sm" type="submit" style="justify-self:start">저장</button>
      </form>
    </section>

    <section class="card" style="padding:24px;margin-top:16px" aria-labelledby="pw-title">
      <h2 id="pw-title" style="font-family:var(--serif);font-size:19px;margin-bottom:14px">비밀번호 바꾸기</h2>
      <form id="pw-form" class="stack">
        <label class="field"><span>새 비밀번호 <small>8자 이상</small></span><input class="input" name="password" type="password" minlength="8" required autocomplete="new-password"></label>
        <button class="btn btn--ghost btn--sm" type="submit" style="justify-self:start">바꾸기</button>
      </form>
    </section>

    <button class="btn btn--ghost btn--sm" id="logout" type="button" style="margin-top:24px">로그아웃</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="account.js"></script>
</body>
</html>
